<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Voorbeeldsite</title>
  </head>
  <body>
    <div id="banner" class="banner" role="status" hidden></div>
    <header class="top">
      <h1 id="name">…</h1>
      <nav id="langs" class="langs" aria-label="Taal" hidden></nav>
      <p id="badge" class="badge" role="status" aria-live="polite"></p>
    </header>
    <main>
      <section id="intro" hidden><p id="hero-text" class="lead"></p></section>
      <section id="about" aria-labelledby="h-about" hidden><h2 id="h-about"></h2><div id="about-body"></div></section>
      <section id="hours" aria-labelledby="h-hours"><h2 id="h-hours" data-t="hours">Openingstijden</h2><dl id="hours-list"></dl><p id="exceptions" class="note"></p></section>
      <section id="specials" aria-labelledby="h-spec" hidden><h2 id="h-spec" data-t="special">Vandaag speciaal</h2><ul id="specials-list" class="items"></ul></section>
      <section id="agenda" aria-labelledby="h-agenda" hidden><h2 id="h-agenda" data-t="agenda">Agenda</h2><ul id="agenda-list" class="items"></ul></section>
      <section id="menu" aria-labelledby="h-menu"><h2 id="h-menu" data-t="menu">Menukaart</h2><div id="menu-tabs" class="tabs" role="tablist"></div><div id="menu-body"></div>
        <p class="note" data-t="allergyNote">Heb je een allergie? Vraag het de bediening, ook als er hieronder niets bij staat.</p></section>
      <section id="location" aria-labelledby="h-loc" hidden><h2 id="h-loc" data-t="location">Adres en route</h2><div id="location-body"></div></section>
      <section id="contact" aria-labelledby="h-contact"><h2 id="h-contact" data-t="contact">Contact of groepsaanvraag</h2>
        <form id="form">
          <label><span data-t="name">Naam</span><input name="name" required autocomplete="name" /></label>
          <label><span data-t="email">E-mail</span><input name="email" type="email" required autocomplete="email" /></label>
          <label><span data-t="message">Bericht</span><textarea name="message" required rows="4"></textarea></label>
          <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp" />
          <button type="submit" data-t="send">Verstuur</button>
          <p id="form-status" role="status"></p>
        </form></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
